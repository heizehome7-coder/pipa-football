# Render Blueprint — PIPA (게임 화면 + 실시간 대결 서버를 하나의 무료 웹 서비스로)
services:
  - type: web
    name: pipa-football
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node server/realtime-server.mjs
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
